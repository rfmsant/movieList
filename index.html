<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cinema Classics</title>
<meta name="description" content="Track the must-watch classics and every Oscar-winning film in history.">
<meta name="theme-color" content="#0f1115">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cinema">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a href="#/" class="brand"><span class="brand-icon">🎬</span><span class="brand-text">Cinema Classics</span> <span id="profile-tag" class="profile-tag"></span></a>
    <nav class="tabs">
      <a href="#/classics" data-tab="classics">Classics</a>
      <a href="#/oscars" data-tab="oscars">Oscars</a>
      <a href="#/stats" data-tab="stats">Progress</a>
    </nav>
    <button id="search-btn" type="button" title="Search films" aria-label="Search films">🔍</button>
    <button id="random-btn" type="button" title="Pick something random" aria-label="Pick something random">🎲</button>
  </div>
  <div id="global-search-bar" class="global-search-bar hidden">
    <div class="global-search-input-wrap">
      <input type="search" id="global-search-input" placeholder="Search any film..." aria-label="Search films">
      <button id="global-search-clear" type="button" aria-label="Close search" title="Close search">✕</button>
    </div>
    <div id="global-search-results" class="global-search-results"></div>
  </div>
</header>

<main id="app"></main>

<div id="detail-overlay" class="overlay hidden">
  <div class="overlay-panel" id="detail-panel"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
